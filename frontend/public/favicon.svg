<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Sky circle badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#4EC0CA" stroke="#1E293B" stroke-width="4"/>
  <!-- Cloud silhouette -->
  <path d="M8 48 C8 42, 16 42, 18 45 C21 40, 31 40, 33 45 C37 42, 45 43, 46 48 Z" fill="#E0F7FA" opacity="0.8"/>
  <!-- Bird Body -->
  <ellipse cx="30" cy="32" rx="16" ry="13" fill="#F7D51D" stroke="#1E293B" stroke-width="3.5"/>
  <!-- Belly shading -->
  <path d="M16 35 Q30 45 43 35 Q38 44 26 44 Q18 42 16 35 Z" fill="#E89A10"/>
  <!-- Wing (Flapping) -->
  <ellipse cx="23" cy="32" rx="8" ry="5.5" transform="rotate(-15 23 32)" fill="#FFFDF0" stroke="#1E293B" stroke-width="3"/>
  <!-- Eye -->
  <circle cx="38" cy="27" r="6" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
  <circle cx="40" cy="27" r="2.5" fill="#1E293B"/>
  <!-- Iconic Orange Lips / Beak -->
  <rect x="40" y="32" width="14" height="5" rx="2" fill="#F76806" stroke="#1E293B" stroke-width="3"/>
  <rect x="40" y="37" width="12" height="4.5" rx="2" fill="#D9480F" stroke="#1E293B" stroke-width="3"/>
</svg>
